name: CI e Deploy

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate:
    name: Validar aplicação e documentação
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-docs.txt

      - name: Validar configuração Django
        run: python manage.py check

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations
        run: python manage.py migrate --noinput

      - name: Rodar testes
        run: python manage.py test

      - name: Validar manual
        run: mkdocs build --strict

  deploy:
    name: Deploy com Ansible
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Preparar chaves SSH e inventário
        env:
          PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          IP_VPS: ${{ secrets.VPS_IP }}
          USUARIO_VPS: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$IP_VPS ansible_user=$USUARIO_VPS" > inventory.ini

      - name: Executar Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          DOTENV_SECRET: ${{ secrets.ENV_FILE_CONTENT_OBSERVATORIO }}
        run: ansible-playbook -i inventory.ini ansible/deploy.yml --private-key ~/.ssh/id_rsa
