services:
  web:
    build: .
    image: observapvh
    container_name: observapvh
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  docs:
    image: squidfunk/mkdocs-material
    container_name: observapvh_docs
    volumes:
      - .:/docs
    ports:
      - "8001:8000"

