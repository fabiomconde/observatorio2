{% extends 'core/base.html' %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 fw-bold" style="color: var(--cor-destaque);">404</div>
    <h1 class="fw-bold" style="color: var(--cor-escura);">Página não encontrada</h1>
    <p class="text-muted">A página que você procura não existe ou foi movida.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary mt-3">
        <i class="bi bi-house"></i> Voltar ao início
    </a>
</div>
{% endblock %}
