{% extends 'core/base.html' %}

{% block extra_head %}
{{ block.super }}
<style>
    /* Padrão base_painel: 100% largura horizontal e altura responsiva ajustável */
    main.flex-grow-1 {
        display: flex;
        flex-direction: column;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    .painel-full-width {
        width: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }
    .painel-iframe-container {
        width: 100%;
        flex-grow: 1;
        height: 78vh;
        height: 78dvh;
        min-height: 550px;
        border: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #ffffff;
        -webkit-overflow-scrolling: touch;
    }
    .painel-iframe-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }

    /* Responsividade para Tablets e Dispositivos Móveis */
    @media (max-width: 992px) {
        .painel-iframe-container {
            height: 75vh;
            height: 75dvh;
            min-height: 480px;
        }
    }
    @media (max-width: 576px) {
        .painel-iframe-container {
            height: 70vh;
            height: 70dvh;
            min-height: 400px;
        }
    }
</style>
{% block painel_extra_head %}{% endblock %}
{% endblock %}

{% block content %}
<div class="painel-full-width">
    {% block painel_header %}{% endblock %}
    <div class="painel-iframe-container">
        {% block painel_body %}{% endblock %}
    </div>
    {% block painel_footer %}{% endblock %}
</div>
{% endblock %}
