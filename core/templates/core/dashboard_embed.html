{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ dashboard.titulo|default:"Dashboard" }} — {{ SITE_NAME }}{% endblock %}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f2f5;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        src="{{ url_dashboard }}" 
        id="superset-frame"
        allowfullscreen>
    </iframe>
</body>
</html>
