{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard — {{ SITE_NAME }}{% endblock %}</title>
    <style>
        /* Impede que a página do Django role, apenas o Dashboard vai rolar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f0f2f5;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* O cabeçalho ocupa o espaço natural dele */
        .site-header {
            flex-shrink: 0;
        }

        /* O Iframe ocupa TODO o resto da tela disponível */
        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="site-header">
            <!-- AQUI VAI O SEU CABEÇALHO (Logo, links, etc) -->
            {% include "partials/header.html" %} 
        </div>

        <iframe 
            src="{{ url_dashboard }}&standalone=2" 
            id="superset-frame">
        </iframe>
    </div>
</body>
</html>
