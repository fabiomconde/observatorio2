{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Dashboard — {{ SITE_NAME }}{% endblock %}</title>
    <style>
        /* Trava a rolagem da página externa para evitar barra dupla */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Importante: impede a página de fora de rolar */
            background-color: #f5f5f5;
        }

        /* Container que ocupa o espaço restante abaixo do seu cabeçalho (se houver) */
        .dashboard-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            height: 100%; /* O iframe ocupa todo o wrapper */
            border: 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Se você tiver um cabeçalho/header no seu site Django, coloque-o aqui -->
        {% block header %}{% endblock %}

        <iframe 
            src="{{ url_dashboard }}&standalone=2" 
            id="superset-frame"
            allowtransparency="true">
        </iframe>
    </div>
</body>
</html>
